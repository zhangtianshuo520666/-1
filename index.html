<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Pong</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Simple Pong</h1>
    <div class="scoreboard">
      <span id="score-left">0</span>
      <span class="sep">—</span>
      <span id="score-right">0</span>
    </div>
    <canvas id="game" width="800" height="500"></canvas>
    <div class="controls">
      <p>Controls: Move mouse over the canvas or use ↑ / ↓. Press Space to pause/resume. Refresh to restart.</p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
